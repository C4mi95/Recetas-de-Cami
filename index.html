<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recetas de Cami</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f5f0e8; --cream-dark: #ede5d4; --cream-darker: #e0d5c0;
    --brown-dark: #2c1f0e; --brown-mid: #5c3d1e; --brown-light: #8b6340;
    --olive: #6b7c4a; --olive-light: #8a9e60; --olive-pale: #c8d5a8;
    --taupe: #b8a88a; --taupe-light: #d4c9b0; --sand: #c9b89a;
    --red-cherry: #c0392b;
    --paper-texture: repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(139, 99, 64, 0.06) 27px, rgba(139, 99, 64, 0.06) 28px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background-color: var(--cream-dark); background-image: var(--paper-texture); font-family: 'Lato', sans-serif; color: var(--brown-dark); min-height: 100vh; }
  header { background-color: var(--cream); border-bottom: 2px solid var(--taupe); padding: 18px 32px 14px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 12px rgba(92,61,30,0.10); position: sticky; top: 0; z-index: 100; }
  .logo { display: flex; flex-direction: column; line-height: 1; }
  .logo-main { font-family: 'Dancing Script', cursive; font-size: 2.2rem; color: var(--brown-dark); font-weight: 700; }
  .logo-sub { font-family: 'Lato', sans-serif; font-size: 0.68rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--olive); margin-top: 1px; }
  .header-actions { display: flex; gap: 10px; align-items: center; }
  .btn-primary { background: var(--olive); color: #fff; border: none; padding: 9px 20px; border-radius: 4px; font-family: 'Lato', sans-serif; font-size: 0.82rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; cursor: pointer; transition: background 0.2s; }
  .btn-primary:hover { background: var(--olive-light); }
  .btn-ghost { background: transparent; border: 1.5px solid var(--taupe); color: var(--brown-mid); padding: 8px 16px; border-radius: 4px; font-family: 'Lato', sans-serif; font-size: 0.82rem; letter-spacing: 0.06em; cursor: pointer; transition: all 0.2s; }
  .btn-ghost:hover { border-color: var(--olive); color: var(--olive); }
  .app-wrapper { display: flex; min-height: calc(100vh - 68px); }
  .sidebar { width: 220px; flex-shrink: 0; background: var(--cream); border-right: 1.5px solid var(--taupe-light); padding: 28px 0; position: sticky; top: 68px; height: calc(100vh - 68px); overflow-y: auto; }
  .sidebar-title { font-family: 'Lato', sans-serif; font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--taupe); padding: 0 22px 12px; border-bottom: 1px solid var(--taupe-light); margin-bottom: 8px; }
  .cat-item { display: flex; align-items: center; gap: 9px; padding: 9px 22px; cursor: pointer; transition: background 0.15s; font-size: 0.88rem; color: var(--brown-mid); font-weight: 400; border-left: 3px solid transparent; }
  .cat-item:hover { background: var(--cream-dark); }
  .cat-item.active { background: var(--cream-dark); border-left-color: var(--olive); color: var(--olive); font-weight: 700; }
  .cat-count { margin-left: auto; background: var(--cream-darker); color: var(--taupe); font-size: 0.68rem; padding: 2px 7px; border-radius: 10px; font-weight: 700; }
  .content { flex: 1; padding: 32px 36px; overflow-y: auto; }
  .content-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 28px; }
  .content-title { font-family: 'Dancing Script', cursive; font-size: 2.4rem; color: var(--brown-dark); line-height: 1; }
  .content-title span { display: block; font-family: 'Lato', sans-serif; font-size: 0.72rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--taupe); margin-bottom: 4px; font-weight: 400; }
  .search-bar { display: flex; align-items: center; background: var(--cream); border: 1.5px solid var(--taupe-light); border-radius: 4px; padding: 0 14px; gap: 8px; width: 220px; }
  .search-bar input { background: transparent; border: none; outline: none; font-family: 'Lato', sans-serif; font-size: 0.85rem; color: var(--brown-dark); padding: 8px 0; width: 100%; }
  .recipe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px; }
  .recipe-card { background: var(--cream); border: 1px solid var(--taupe-light); border-radius: 3px; cursor: pointer; transition: all 0.2s; overflow: hidden; box-shadow: 2px 3px 8px rgba(92,61,30,0.07); position: relative; }
  .recipe-card:hover { transform: translateY(-3px); box-shadow: 4px 8px 20px rgba(92,61,30,0.13); }
  .card-tape { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); width: 48px; height: 18px; background: rgba(184,168,138,0.55); border-radius: 2px; z-index: 2; }
  .card-img-wrap { width: 100%; height: 155px; overflow: hidden; position: relative; background: var(--cream-darker); display: flex; align-items: center; justify-content: center; }
  .card-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .card-img-emoji { font-size: 2.5rem; color: var(--taupe); }
  .card-body { padding: 16px 18px 14px; background: var(--paper-texture), var(--cream); }
  .card-cat { font-size: 0.63rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--olive); font-weight: 700; margin-bottom: 5px; }
  .card-title { font-family: 'Dancing Script', cursive; font-size: 1.35rem; color: var(--brown-dark); line-height: 1.2; margin-bottom: 6px; }
  .card-meta { display: flex; gap: 12px; font-size: 0.75rem; color: var(--taupe); }
  .card-heart { position: absolute; bottom: 12px; right: 14px; font-size: 1rem; cursor: pointer; opacity: 0.4; transition: all 0.2s; color: var(--red-cherry); }
  .card-heart.active { opacity: 1; transform: scale(1.15); }
  .add-card { background: transparent; border: 2px dashed var(--taupe-light); border-radius: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 260px; cursor: pointer; transition: all 0.2s; color: var(--taupe); }
  .add-card:hover { border-color: var(--olive); background: rgba(107,124,74,0.04); color: var(--olive); }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(44,31,14,0.55); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .recipe-modal, .form-modal { background: var(--cream); border-radius: 4px; max-width: 720px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; box-shadow: 0 20px 60px rgba(44,31,14,0.3); background-image: var(--paper-texture), var(--cream); }
  .form-modal { max-width: 600px; padding: 36px; }
  .notebook-holes { position: absolute; left: 0; top: 0; bottom: 0; width: 32px; background: var(--cream-darker); border-right: 1.5px solid var(--taupe-light); display: flex; flex-direction: column; padding-top: 40px; z-index: 1; }
  .hole { width: 14px; height: 14px; border-radius: 50%; background: var(--cream-dark); border: 1.5px solid var(--taupe); margin: 0 auto 18px; }
  .modal-inner { padding: 36px 36px 40px 56px; }
  .modal-close { position: absolute; top: 14px; right: 18px; background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--taupe); z-index: 5; }
  .modal-edit-btn { position: absolute; top: 14px; right: 52px; background: none; border: 1px solid var(--taupe-light); padding: 5px 12px; font-size: 0.72rem; text-transform: uppercase; color: var(--olive); cursor: pointer; border-radius: 3px; z-index: 5; }
  .recipe-modal-header { display: flex; gap: 28px; margin-bottom: 30px; }
  .recipe-modal-photo { width: 200px; height: 170px; border: 3px solid #fff; box-shadow: 3px 3px 12px rgba(92,61,30,0.18); transform: rotate(1.5deg); background: var(--cream-darker); display: flex; align-items: center; justify-content: center; font-size: 3rem; overflow: hidden; }
  .recipe-modal-title { font-family: 'Dancing Script', cursive; font-size: 2.6rem; color: var(--brown-dark); line-height: 1.1; }
  .meta-pill { display: flex; align-items: center; gap: 5px; background: var(--cream-darker); border: 1px solid var(--taupe-light); padding: 5px 12px; border-radius: 20px; font-size: 0.78rem; }
  .modal-two-col { display: grid; grid-template-columns: 1fr 1.6fr; gap: 32px; }
  .ingredients-list { list-style: none; }
  .ingredients-list li { padding: 6px 0; border-bottom: 1px solid var(--cream-darker); font-size: 0.88rem; }
  .steps-list { list-style: none; counter-reset: steps; }
  .steps-list li { counter-increment: steps; display: flex; gap: 12px; margin-bottom: 14px; font-size: 0.88rem; }
  .step-num { flex-shrink: 0; width: 24px; height: 24px; background: var(--taupe-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; }
  .tips-box { margin-top: 22px; background: var(--cream-darker); border-left: 3px solid var(--olive); padding: 14px 18px; border-radius: 3px; }
  .form-group { margin-bottom: 18px; }
  .form-label { display: block; font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--taupe); font-weight: 700; margin-bottom: 6px; }
  .form-input, .form-select, .form-textarea { width: 100%; border: 1.5px solid var(--taupe-light); border-radius: 3px; padding: 9px 13px; font-family: 'Lato', sans-serif; outline: none; }
  .photo-upload-area { border: 2px dashed var(--taupe-light); border-radius: 4px; padding: 18px; text-align: center; cursor: pointer; position: relative; background: #fff; }
  .photo-upload-preview { width: 100%; max-height: 200px; object-fit: cover; display: none; }
  .photo-upload-preview.visible { display: block; }
  .photo-remove-btn { position: absolute; top: 8px; right: 8px; background: rgba(44,31,14,0.6); color: #fff; border: none; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; display: none; align-items: center; justify-content: center; z-index: 2; }
  .photo-remove-btn.visible { display: flex; }
  .ing-row, .step-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .remove-btn { background: none; border: none; color: var(--taupe); cursor: pointer; }
  .add-row-btn { background: none; border: 1px dashed var(--taupe); color: var(--taupe); padding: 6px 14px; font-size: 0.78rem; cursor: pointer; border-radius: 3px; }
  .toast { position: fixed; bottom: 28px; right: 28px; background: var(--brown-dark); color: var(--cream); padding: 12px 20px; border-radius: 4px; font-size: 0.85rem; z-index: 999; transform: translateY(80px); opacity: 0; transition: all 0.3s; }
  .toast.show { transform: translateY(0); opacity: 1; }
  @media (max-width: 700px) { .sidebar { display: none; } .modal-two-col { grid-template-columns: 1fr; } .recipe-modal-header { flex-direction: column; } }
</style>
</head>
<body>

<header>
  <div class="logo"><span class="logo-sub">Libro de</span><span class="logo-main">Recetas de Cami</span></div>
  <div class="header-actions">
    <button class="btn-ghost" onclick="openSearch()">🔍 Buscar</button>
    <button class="btn-primary" onclick="openFormModal()">+ Nueva Receta</button>
  </div>
</header>

<div class="app-wrapper">
  <aside class="sidebar"><div class="sidebar-title">Categorías</div><div id="catList"></div></aside>
  <main class="content">
    <div class="content-header">
      <div class="content-title"><span id="catLabel">todas las categorías</span><span id="catTitle">Todas las Recetas</span></div>
      <div class="search-bar" id="searchBarWrap" style="display:none"><input type="text" id="searchInput" placeholder="Buscar receta..." oninput="renderGrid()"></div>
    </div>
    <div class="recipe-grid" id="recipeGrid"></div>
  </main>
</div>

<!-- MODALS -->
<div class="modal-overlay" id="detailOverlay" onclick="closeDetail(event)">
  <div class="recipe-modal" id="detailModal">
    <div class="notebook-holes" id="notebookHoles"></div>
    <button class="modal-close" onclick="closeDetailModal()">✕</button>
    <button class="modal-edit-btn" onclick="editCurrentRecipe()">Editar</button>
    <div class="modal-inner" id="detailContent"></div>
  </div>
</div>

<div class="modal-overlay" id="formOverlay" onclick="closeForm(event)">
  <div class="form-modal" id="formModal">
    <button class="modal-close" onclick="closeFormModal()">✕</button>
    <div class="form-title" id="formTitle">Nueva Receta</div>
    <div class="form-group">
      <label class="form-label">📸 Foto</label>
      <div class="photo-upload-area" id="photoUploadArea">
        <input type="file" id="fPhoto" accept="image/*" onchange="handlePhotoUpload(event)">
        <button class="photo-remove-btn" id="photoRemoveBtn" onclick="removePhoto(event)">✕</button>
        <img class="photo-upload-preview" id="photoPreview">
        <div id="photoPlaceholder">📷 Subir foto</div>
      </div>
    </div>
    <div class="form-group"><label class="form-label">Nombre *</label><input type="text" class="form-input" id="fTitle"></div>
    <div class="form-group"><label class="form-label">Categoría *</label><select class="form-select" id="fCat"></select></div>
    <div class="form-group"><label class="form-label">Emoji</label><input type="text" class="form-input" id="fEmoji"></div>
    <div class="form-group"><label class="form-label">Ingredientes *</label><div id="ingList"></div><button class="add-row-btn" onclick="addIng()">+ Ingrediente</button></div>
    <div class="form-group"><label class="form-label">Pasos *</label><div id="stepList"></div><button class="add-row-btn" onclick="addStep()">+ Paso</button></div>
    <div class="form-group"><label class="form-label">Tips</label><textarea class="form-textarea" id="fTips"></textarea></div>
    <div class="form-actions"><button class="btn-ghost" onclick="closeFormModal()">Cancelar</button><button class="btn-primary" onclick="saveRecipe()">Guardar ♥</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- FIREBASE SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, onValue, push, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD2TXeLiFDCw6hlqKcrkNTo_VCaWqXcKi4",
    authDomain: "recetas-de-cami-b74fd.firebaseapp.com",
    databaseURL: "https://recetas-de-cami-b74fd-default-rtdb.firebaseio.com",
    projectId: "recetas-de-cami-b74fd",
    storageBucket: "recetas-de-cami-b74fd.firebasestorage.app",
    messagingSenderId: "664990770751",
    appId: "1:664990770751:web:466aa84c88d7cb4285ba8a"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const recipesRef = ref(db, 'recetas');

  // ——— APP LOGIC ———
  window.CATEGORIES = [
    { id: 'todas', label: 'Todas', icon: '📖' }, { id: 'entradas', label: 'Entradas', icon: '🥗' },
    { id: 'principales', label: 'Principales', icon: '🍽' }, { id: 'carnes', label: 'Carnes', icon: '🥩' },
    { id: 'pastas', label: 'Pastas', icon: '🍝' }, { id: 'panificados', label: 'Panificados', icon: '🍞' },
    { id: 'ensaladas', label: 'Ensaladas', icon: '🥬' }, { id: 'guarniciones', label: 'Guarniciones', icon: '🥔' },
    { id: 'dips-salsas', label: 'Dips y Salsas', icon: '🫙' }, { id: 'postres', label: 'Postres', icon: '🍰' },
    { id: 'bebidas', label: 'Bebidas', icon: '🥤' }, { id: 'otros', label: 'Otros', icon: '✨' }
  ];

  let recipes = [];
  let activeCategory = 'todas';
  let editingId = null;
  let currentPhotoData = null;

  // Listen for changes in Firebase
  onValue(recipesRef, (snapshot) => {
    const data = snapshot.val();
    // Las recetas se cargan desde la DB, si la DB está vacía, la lista estará vacía.
    recipes = data ? Object.keys(data).map(key => ({ ...data[key], fbKey: key })) : [];
    renderSidebar();
    renderGrid();
  });

  window.renderSidebar = () => {
    const el = document.getElementById('catList');
    if(!el) return;
    el.innerHTML = window.CATEGORIES.map(c => {
      const count = c.id === 'todas' ? recipes.length : recipes.filter(r => r.category === c.id).length;
      return `<div class="cat-item ${activeCategory === c.id ? 'active' : ''}" onclick="setCategory('${c.id}', '${c.label}')">
        <span>${c.icon} ${c.label}</span><span class="cat-count">${count}</span>
      </div>`;
    }).join('');
  };

  window.setCategory = (id, label) => {
    activeCategory = id;
    document.getElementById('catTitle').textContent = id === 'todas' ? 'Todas las Recetas' : label;
    renderSidebar(); renderGrid();
  };

  window.renderGrid = () => {
    const grid = document.getElementById('recipeGrid');
    if(!grid) return;
    const q = (document.getElementById('searchInput')?.value || '').toLowerCase();
    let list = recipes.filter(r => (activeCategory === 'todas' || r.category === activeCategory) && (!q || r.title.toLowerCase().includes(q)));
    
    grid.innerHTML = list.map(r => `
      <div class="recipe-card" onclick="openDetail('${r.fbKey}')">
        <div class="card-tape"></div>
        <div class="card-img-wrap">${r.photo ? `<img src="${r.photo}">` : `<span class="card-img-emoji">${r.emoji || '📖'}</span>`}</div>
        <div class="card-body">
          <div class="card-cat">${r.category}</div>
          <div class="card-title">${r.title}</div>
        </div>
        <span class="card-heart ${r.fav ? 'active' : ''}" onclick="toggleFav(event,'${r.fbKey}')">♥</span>
      </div>`).join('') + `<div class="add-card" onclick="openFormModal()">+ Agregar</div>`;
  };

  window.toggleFav = (e, fbKey) => {
    e.stopPropagation();
    const r = recipes.find(r => r.fbKey === fbKey);
    if(r) update(ref(db, 'recetas/' + fbKey), { fav: !r.fav });
  };

  window.openDetail = (fbKey) => {
    const r = recipes.find(r => r.fbKey === fbKey);
    if(!r) return;
    window.currentDetailKey = fbKey;
    document.getElementById('detailContent').innerHTML = `
      <div class="recipe-modal-header">
        <div class="recipe-modal-photo">${r.photo ? `<img src="${r.photo}" style="width:100%">` : r.emoji || '📖'}</div>
        <div>
          <div class="recipe-modal-title">${r.title}</div>
          <div class="meta-pill">📂 ${r.category}</div>
        </div>
      </div>
      <div class="modal-two-col">
        <div><strong>Ingredientes:</strong><ul>${r.ingredients.map(i => `<li>${i.qty} ${i.name}</li>`).join('')}</ul></div>
        <div><strong>Pasos:</strong><ol>${r.steps.map(s => `<li>${s}</li>`).join('')}</ol></div>
      </div>`;
    document.getElementById('detailOverlay').classList.add('open');
  };

  window.saveRecipe = () => {
    const title = document.getElementById('fTitle').value;
    if (!title) return alert('Nombre obligatorio');
    
    const ings = Array.from(document.querySelectorAll('#ingList .ing-row')).map(row => ({
      qty: row.querySelector('input:first-child').value,
      name: row.querySelector('input:nth-child(2)').value
    })).filter(i => i.name);

    const steps = Array.from(document.querySelectorAll('#stepList .step-row input')).map(i => i.value).filter(s => s);

    const data = {
      title, category: document.getElementById('fCat').value,
      emoji: document.getElementById('fEmoji').value,
      photo: currentPhotoData, tips: document.getElementById('fTips').value,
      ingredients: ings, steps, fav: false
    };

    if (editingId) {
      update(ref(db, 'recetas/' + editingId), data);
    } else {
      push(recipesRef, data);
    }
    closeFormModal();
  };

  // UI Helpers
  window.openFormModal = (id = null) => {
    editingId = id;
    populateCat();
    document.getElementById('ingList').innerHTML = ''; document.getElementById('stepList').innerHTML = '';
    if(!id) { addIng(); addStep(); }
    document.getElementById('formOverlay').classList.add('open');
  };
  window.closeFormModal = () => document.getElementById('formOverlay').classList.remove('open');
  window.closeDetailModal = () => document.getElementById('detailOverlay').classList.remove('open');
  window.addIng = () => {
    const d = document.createElement('div'); d.className = 'ing-row';
    d.innerHTML = `<input type="text" placeholder="Cant."><input type="text" placeholder="Ingrediente">`;
    document.getElementById('ingList').appendChild(d);
  };
  window.addStep = () => {
    const d = document.createElement('div'); d.className = 'step-row';
    d.innerHTML = `<input type="text" placeholder="Paso...">`;
    document.getElementById('stepList').appendChild(d);
  };
  function populateCat() {
    const el = document.getElementById('fCat');
    if(el) el.innerHTML = window.CATEGORIES.filter(c => c.id !== 'todas').map(c => `<option value="${c.id}">${c.label}</option>`).join('');
  }
  window.handlePhotoUpload = (e) => {
    const reader = new FileReader();
    reader.onload = (event) => {
      currentPhotoData = event.target.result;
      const prev = document.getElementById('photoPreview');
      prev.src = currentPhotoData; prev.classList.add('visible');
    };
    if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
  };
  window.openSearch = () => {
    const s = document.getElementById('searchBarWrap');
    s.style.display = s.style.display === 'none' ? 'block' : 'none';
  };
</script>
</body>
</html>
