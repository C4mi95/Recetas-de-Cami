<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recetas de Cami</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<!-- Estilos originales mantenidos -->
<style>
  :root {
    --cream: #f5f0e8; --cream-dark: #ede5d4; --cream-darker: #e0d5c0;
    --brown-dark: #2c1f0e; --brown-mid: #5c3d1e; --brown-light: #8b6340;
    --olive: #6b7c4a; --olive-light: #8a9e60; --olive-pale: #c8d5a8;
    --taupe: #b8a88a; --taupe-light: #d4c9b0; --sand: #c9b89a;
    --red-cherry: #c0392b;
    --paper-texture: repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(139, 99, 64, 0.06) 27px, rgba(139, 99, 64, 0.06) 28px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background-color: var(--cream-dark); background-image: var(--paper-texture); font-family: 'Lato', sans-serif; color: var(--brown-dark); min-height: 100vh; }
  header { background-color: var(--cream); border-bottom: 2px solid var(--taupe); padding: 18px 32px 14px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 12px rgba(92,61,30,0.10); position: sticky; top: 0; z-index: 100; }
  .logo { display: flex; flex-direction: column; line-height: 1; }
  .logo-main { font-family: 'Dancing Script', cursive; font-size: 2.2rem; color: var(--brown-dark); font-weight: 700; }
  .logo-sub { font-family: 'Lato', sans-serif; font-size: 0.68rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--olive); margin-top: 1px; }
  .header-actions { display: flex; gap: 10px; align-items: center; }
  .btn-primary { background: var(--olive); color: #fff; border: none; padding: 9px 20px; border-radius: 4px; font-family: 'Lato', sans-serif; font-size: 0.82rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; cursor: pointer; transition: background 0.2s; }
  .btn-primary:hover { background: var(--olive-light); }
  .btn-ghost { background: transparent; border: 1.5px solid var(--taupe); color: var(--brown-mid); padding: 8px 16px; border-radius: 4px; font-family: 'Lato', sans-serif; font-size: 0.82rem; letter-spacing: 0.06em; cursor: pointer; transition: all 0.2s; }
  .app-wrapper { display: flex; min-height: calc(100vh - 68px); }
  .sidebar { width: 220px; flex-shrink: 0; background: var(--cream); border-right: 1.5px solid var(--taupe-light); padding: 28px 0; position: sticky; top: 68px; height: calc(100vh - 68px); overflow-y: auto; }
  .sidebar-title { font-family: 'Lato', sans-serif; font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--taupe); padding: 0 22px 12px; border-bottom: 1px solid var(--taupe-light); margin-bottom: 8px; }
  .cat-item { display: flex; align-items: center; gap: 9px; padding: 9px 22px; cursor: pointer; transition: background 0.15s; font-size: 0.88rem; color: var(--brown-mid); font-weight: 400; border-left: 3px solid transparent; }
  .cat-item.active { background: var(--cream-dark); border-left-color: var(--olive); color: var(--olive); font-weight: 700; }
  .cat-count { margin-left: auto; background: var(--cream-darker); color: var(--taupe); font-size: 0.68rem; padding: 2px 7px; border-radius: 10px; font-weight: 700; }
  .content { flex: 1; padding: 32px 36px; overflow-y: auto; }
  .content-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 28px; }
  .content-title { font-family: 'Dancing Script', cursive; font-size: 2.4rem; color: var(--brown-dark); line-height: 1; }
  .content-title span { display: block; font-family: 'Lato', sans-serif; font-size: 0.72rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--taupe); margin-bottom: 4px; font-weight: 400; }
  .recipe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px; }
  .recipe-card { background: var(--cream); border: 1px solid var(--taupe-light); border-radius: 3px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; overflow: hidden; box-shadow: 2px 3px 8px rgba(92,61,30,0.07); position: relative; }
  .recipe-card:hover { transform: translateY(-3px); box-shadow: 4px 8px 20px rgba(92,61,30,0.13); }
  .card-img-wrap { width: 100%; height: 155px; overflow: hidden; position: relative; background: var(--cream-darker); display: flex; align-items: center; justify-content: center; }
  .card-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .card-body { padding: 16px 18px 14px; background: var(--paper-texture), var(--cream); }
  .card-title { font-family: 'Dancing Script', cursive; font-size: 1.35rem; color: var(--brown-dark); }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(44,31,14,0.55); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .recipe-modal, .form-modal { background: var(--cream); border-radius: 4px; max-width: 720px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; padding: 36px; box-shadow: 0 20px 60px rgba(44,31,14,0.3); }
  .form-group { margin-bottom: 18px; }
  .form-input, .form-select, .form-textarea { width: 100%; padding: 9px; border: 1.5px solid var(--taupe-light); border-radius: 3px; }
  .toast { position: fixed; bottom: 28px; right: 28px; background: var(--brown-dark); color: var(--cream); padding: 12px 20px; border-radius: 4px; transform: translateY(80px); opacity: 0; transition: all 0.3s; z-index: 999; }
  .toast.show { transform: translateY(0); opacity: 1; }
</style>
</head>
<body>

<header>
  <div class="logo"><span class="logo-sub">Libro de</span><span class="logo-main">Recetas de Cami</span></div>
  <div class="header-actions">
    <button class="btn-primary" onclick="openFormModal()">+ Nueva Receta</button>
  </div>
</header>

<div class="app-wrapper">
  <aside class="sidebar">
    <div class="sidebar-title">Categorías</div>
    <div id="catList"></div>
  </aside>
  <main class="content">
    <div class="content-header">
      <div class="content-title"><span id="catLabel">todas las categorías</span><span id="catTitle">Todas las Recetas</span></div>
    </div>
    <div class="recipe-grid" id="recipeGrid"></div>
  </main>
</div>

<!-- Modales simplificados para integración -->
<div class="modal-overlay" id="formOverlay" onclick="closeForm(event)">
  <div class="form-modal">
    <h2 id="formTitle" class="logo-main">Nueva Receta</h2>
    <div class="form-group"><label>Nombre</label><input type="text" id="fTitle" class="form-input"></div>
    <div class="form-group">
        <label>Categoría</label>
        <select id="fCat" class="form-select"></select>
    </div>
    <div class="form-group"><label>Emoji</label><input type="text" id="fEmoji" class="form-input" placeholder="🥑"></div>
    <div class="form-actions">
      <button class="btn-ghost" onclick="closeFormModal()">Cancelar</button>
      <button class="btn-primary" onclick="saveRecipe()">Guardar en la Nube ♥</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- FIREBASE SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, set, onValue, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD2TXeLiFDCw6hlqKcrkNTo_VCaWqXcKi4",
    authDomain: "recetas-de-cami-b74fd.firebaseapp.com",
    databaseURL: "https://recetas-de-cami-b74fd-default-rtdb.firebaseio.com",
    projectId: "recetas-de-cami-b74fd",
    storageBucket: "recetas-de-cami-b74fd.firebasestorage.app",
    messagingSenderId: "664990770751",
    appId: "1:664990770751:web:466aa84c88d7cb4285ba8a"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const recipesRef = ref(db, 'recetas');

  // Variables de estado
  let recipes = [];
  const CATEGORIES = [
    { id: 'todas', label: 'Todas', icon: '📖' },
    { id: 'principales', label: 'Principales', icon: '🍽' },
    { id: 'postres', label: 'Postres', icon: '🍰' },
    { id: 'otros', label: 'Otros', icon: '✨' }
  ];

  // Escuchar cambios en tiempo real (Sincronización total)
  onValue(recipesRef, (snapshot) => {
    const data = snapshot.val();
    recipes = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
    renderSidebar();
    renderGrid();
  });

  // Funciones globales para que el HTML las vea
  window.saveRecipe = function() {
    const title = document.getElementById('fTitle').value;
    const cat = document.getElementById('fCat').value;
    const emoji = document.getElementById('fEmoji').value || '📖';

    if (!title) return showToast("¡Ponle un nombre!");

    const newRecipe = {
      title,
      category: cat,
      emoji,
      fav: false
    };

    // Guardar en Firebase (esto se reflejará en todos los dispositivos)
    const newPostRef = push(recipesRef);
    set(newPostRef, newRecipe).then(() => {
        closeFormModal();
        showToast("¡Receta guardada en la nube! ☁️");
    });
  };

  // Renderizado
  function renderGrid() {
    const grid = document.getElementById('recipeGrid');
    grid.innerHTML = recipes.map(r => `
      <div class="recipe-card">
        <div class="card-img-wrap" style="font-size:3rem">${r.emoji}</div>
        <div class="card-body">
          <div class="card-title">${r.title}</div>
        </div>
      </div>
    `).join('') + `<div class="add-card" style="border:2px dashed #ccc; padding:20px; text-align:center; cursor:pointer" onclick="openFormModal()">＋ Nueva</div>`;
  }

  function renderSidebar() {
    const el = document.getElementById('catList');
    el.innerHTML = CATEGORIES.map(c => `
      <div class="cat-item" onclick="filterCat('${c.id}')">
        <span>${c.icon} ${c.label}</span>
      </div>
    `).join('');
  }

  // Modales
  window.openFormModal = () => {
    populateCats();
    document.getElementById('formOverlay').classList.add('open');
  };
  window.closeFormModal = () => document.getElementById('formOverlay').classList.remove('open');
  
  function populateCats() {
    const sel = document.getElementById('fCat');
    sel.innerHTML = CATEGORIES.filter(c => c.id !== 'todas').map(c => `<option value="${c.id}">${c.label}</option>`).join('');
  }

  function showToast(m) {
    const t = document.getElementById('toast');
    t.textContent = m; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }
</script>
</body>
</html>
