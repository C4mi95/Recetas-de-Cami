<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recetas de Cami</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f5f0e8;
    --cream-dark: #ede5d4;
    --brown: #2c1f0e;
    --olive: #6b7c4a;
    --red: #c0392b;
    --taupe: #b8a88a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--cream-dark); font-family: 'Lato', sans-serif; color: var(--brown); }

  header { 
    background: var(--cream); 
    padding: 15px 25px; 
    border-bottom: 2px solid var(--taupe);
    display: flex; 
    justify-content: space-between; 
    align-items: center;
    position: sticky; top: 0; z-index: 1000;
  }

  .logo-main { font-family: 'Dancing Script', cursive; font-size: 1.8rem; }
  
  .header-actions { display: flex; gap: 8px; }

  /* BOTONES */
  .btn { 
    padding: 8px 14px; 
    border-radius: 6px; 
    border: none; 
    font-weight: bold; 
    cursor: pointer; 
    font-size: 13px;
    text-transform: uppercase;
  }
  .btn-new { background: var(--olive); color: white; }
  .btn-select { background: white; border: 1px solid var(--taupe); color: var(--brown); }
  .btn-delete { background: var(--red); color: white; display: none; } /* Inicia oculto */

  .app-container { display: flex; min-height: 90vh; }
  
  .sidebar { 
    width: 200px; background: var(--cream); 
    border-right: 1px solid var(--taupe); 
    padding: 20px 0;
  }
  .cat-item { 
    padding: 12px 20px; cursor: pointer; 
    display: flex; justify-content: space-between;
  }
  .cat-item.active { background: var(--cream-dark); color: var(--olive); font-weight: bold; }

  .main-content { flex: 1; padding: 20px; }
  .grid { 
    display: grid; 
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
    gap: 15px; 
  }

  /* TARJETAS */
  .card { 
    background: white; border: 1px solid var(--taupe); 
    border-radius: 8px; overflow: hidden; position: relative; 
    cursor: pointer; transition: 0.2s;
  }
  .card.selected { border: 3px solid var(--olive); background: #fafff0; }
  
  .card-emoji { height: 100px; display: flex; align-items: center; justify-content: center; font-size: 40px; background: #f9f9f9; }
  .card-txt { padding: 10px; font-family: 'Dancing Script', cursive; font-size: 1.2rem; text-align: center; }

  /* Indicador de selección */
  .check { 
    position: absolute; top: 10px; right: 10px; 
    width: 20px; height: 20px; border-radius: 50%; 
    border: 2px solid var(--taupe); background: white;
    display: none; 
  }
  .select-mode .check { display: block; }
  .selected .check { background: var(--olive); border-color: var(--olive); }

  /* MODAL */
  .modal-bg { 
    display: none; position: fixed; inset: 0; 
    background: rgba(0,0,0,0.5); z-index: 2000; 
    align-items: center; justify-content: center; 
  }
  .modal { background: var(--cream); padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; }
  input, select, textarea { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid var(--taupe); border-radius: 6px; }

</style>
</head>
<body id="bodyTag">

<header>
  <div class="logo-main">Recetas de Cami</div>
  <div class="header-actions">
    <button class="btn btn-select" id="btnSel" onclick="activarSeleccion()">Seleccionar</button>
    <button class="btn btn-delete" id="btnDel" onclick="borrarRecetas()">Eliminar (<span id="n">0</span>)</button>
    <button class="btn btn-new" id="btnNew" onclick="abrirModal()">+ Nueva</button>
  </div>
</header>

<div class="app-container">
  <aside class="sidebar" id="listaGatos"></aside>
  <main class="main-content">
    <div class="grid" id="recetario"></div>
  </main>
</div>

<!-- Ventana para nueva receta -->
<div class="modal-bg" id="miModal">
  <div class="modal">
    <h2 style="font-family:'Dancing Script'">Añadir Receta</h2><br>
    <input type="text" id="titulo" placeholder="Nombre (ej: Chipas)">
    <select id="categoria"></select>
    <input type="text" id="emoji" placeholder="Emoji (ej: 🥯)">
    <textarea id="notas" placeholder="Tips rápidos..."></textarea>
    <button class="btn btn-new" style="width:100%" onclick="guardar()">Guardar en Firebase</button>
    <button class="btn btn-select" style="width:100%; margin-top:10px" onclick="cerrarModal()">Cancelar</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<script>
// CONFIGURACIÓN FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyD2TXeLiFDCw6hlqKcrkNTo_VCaWqXcKi4",
  authDomain: "recetas-de-cami-b74fd.firebaseapp.com",
  databaseURL: "https://recetas-de-cami-b74fd-default-rtdb.firebaseio.com",
  projectId: "recetas-de-cami-b74fd",
  storageBucket: "recetas-de-cami-b74fd.firebasestorage.app",
  messagingSenderId: "664990770751",
  appId: "1:664990770751:web:466aa84c88d7cb4285ba8a"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const CATEGORIAS = [
  {id:'todas', n:'Todas', i:'📖'},
  {id:'entradas', n:'Entradas', i:'🥗'},
  {id:'principales', n:'Principales', i:'🍽'},
  {id:'postres', n:'Postres', i:'🍰'}
];

let misRecetas = [], catActual = 'todas', modoSeleccion = false, seleccionadas = new Set();

// LEER DATOS
db.ref('recipes').on('value', snapshot => {
  const data = snapshot.val();
  misRecetas = data ? Object.keys(data).map(key => ({...data[key], id: key})) : [];
  dibujarTodo();
});

function activarSeleccion() {
  modoSeleccion = !modoSeleccion;
  seleccionadas.clear();
  
  // Cambiar visibilidad de botones
  document.getElementById('btnDel').style.display = modoSeleccion ? 'block' : 'none';
  document.getElementById('btnNew').style.display = modoSeleccion ? 'none' : 'block';
  document.getElementById('btnSel').textContent = modoSeleccion ? 'Cancelar' : 'Seleccionar';
  document.getElementById('bodyTag').classList.toggle('select-mode', modoSeleccion);
  
  actualizarContador();
  dibujarTodo();
}

function tocarReceta(id) {
  if(!modoSeleccion) return;
  seleccionadas.has(id) ? seleccionadas.delete(id) : seleccionadas.add(id);
  actualizarContador();
  dibujarTodo();
}

function actualizarContador() {
  document.getElementById('n').textContent = seleccionadas.size;
}

function borrarRecetas() {
  if(seleccionadas.size === 0) return;
  if(confirm(`¿Quieres borrar estas ${seleccionadas.size} recetas?`)) {
    seleccionadas.forEach(id => db.ref('recipes/' + id).remove());
    activarSeleccion(); // Salir del modo borrar
  }
}

function dibujarTodo() {
  const grid = document.getElementById('recetario');
  const filtradas = misRecetas.filter(r => catActual === 'todas' || r.category === catActual);
  
  grid.innerHTML = filtradas.map(r => `
    <div class="card ${seleccionadas.has(r.id) ? 'selected' : ''}" onclick="tocarReceta('${r.id}')">
      <div class="check"></div>
      <div class="card-emoji">${r.emoji || '🥘'}</div>
      <div class="card-txt">${r.title}</div>
    </div>
  `).join('');

  document.getElementById('listaGatos').innerHTML = CATEGORIAS.map(c => `
    <div class="cat-item ${catActual === c.id ? 'active' : ''}" onclick="catActual='${c.id}';dibujarTodo()">
      <span>${c.i} ${c.n}</span>
      <span>${c.id==='todas' ? misRecetas.length : misRecetas.filter(r=>r.category===c.id).length}</span>
    </div>
  `).join('');
}

// FUNCIONES MODAL
function abrirModal() {
  document.getElementById('categoria').innerHTML = CATEGORIAS.filter(c=>c.id!=='todas').map(c=>`<option value="${c.id}">${c.n}</option>`).join('');
  document.getElementById('miModal').style.display = 'flex';
}
function cerrarModal() { document.getElementById('miModal').style.display = 'none'; }

function guardar() {
  const t = document.getElementById('titulo').value;
  if(!t) return alert("Ponle nombre!");
  
  db.ref('recipes').push({
    title: t,
    category: document.getElementById('categoria').value,
    emoji: document.getElementById('emoji').value,
    notes: document.getElementById('notas').value
  }).then(() => {
    cerrarModal();
    document.getElementById('titulo').value = "";
  });
}
</script>
</body>
</html>
